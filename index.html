<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Betegbehívó</title>
<script src="/qrcode.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: egy oldal, négy nézet (#kijelzo, #orvos-N, #recepcio, #beallitasok). Nyugodt mélykék + zsálya. */
:root{
  --bg:#fafafa; --surface:#ffffff; --line:#ebe4dc; --fg:#3a312a; --muted:#8a7d72;
  --ink:#9a734a; --sage:#a88b6e; --sage-soft:#f3ede6; --warn:#b5762a; --warn-soft:#f7eddf;
  --danger:#a8463d; --danger-soft:#f6e4e2;
  --display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --body:"Open Sans",ui-sans-serif,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17110d; --surface:#221a14; --line:#3a2d23; --fg:#f1e8dd; --muted:#b4a392;
  --ink:#d9b98c; --sage:#c9a46c; --sage-soft:#33271d; --warn:#d9a35f; --warn-soft:#33281b;
  --danger:#e08a80; --danger-soft:#3a2321; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110d; --surface:#221a14; --line:#3a2d23; --fg:#f1e8dd; --muted:#b4a392;
  --ink:#d9b98c; --sage:#c9a46c; --sage-soft:#33271d; --warn:#d9a35f; --warn-soft:#33281b;
  --danger:#e08a80; --danger-soft:#3a2321; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:40px;width:auto;max-width:160px;object-fit:contain}
.brand img.lg{height:46px;max-width:none}.brand .lg-sub{border-left:1px solid var(--line);padding-left:12px}
.lg-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .lg-d{display:block}}
:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .lg-d{display:block}
.mark{width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand-name{font-family:var(--display);font-weight:700;font-size:18px}
.brand-sub{color:var(--muted);font-size:13px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{color:var(--fg);background:var(--surface)}
.nav a.on{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--line);transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sage{background:var(--sage);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.grid{display:grid;gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.waiting{background:var(--sage-soft);color:var(--sage)}
.pill.called{background:var(--ink);color:var(--bg)}
.pill.done{background:var(--line);color:var(--muted)}
.pill.missed{background:var(--warn-soft);color:var(--warn)}
.code{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--fg);font-size:14px;margin-bottom:20px}
.banner b{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Kezdőlap */
.hero-h{font-size:clamp(28px,4vw,40px);font-weight:700;margin:6px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px}
.tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--sage);transform:translateY(-2px)}
.tile h3{font-size:20px}
.tile .ico{width:44px;height:44px;border-radius:12px;background:var(--sage-soft);display:grid;place-items:center;color:var(--sage)}
.tile .ico svg{width:22px;height:22px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.links a{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.steps{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.steps p{margin:6px 0 0;color:var(--muted);font-size:14px}

/* Orvosi felület */
.doc-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.doc-layout{grid-template-columns:1fr}}
.now{display:flex;flex-direction:column;gap:18px;padding:28px}
.now .code{font-size:clamp(52px,8vw,100px);white-space:nowrap;line-height:1;color:var(--ink)}
.now .empty{font-family:var(--display);font-size:22px;color:var(--muted);padding:26px 0}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.actions .btn{padding:18px 12px;font-size:16px}
@media (max-width:480px){.actions{grid-template-columns:1fr 1fr}.actions .btn:first-child{grid-column:1/-1}}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .code{font-size:20px}
.row .meta{min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .meta b{display:block;font-size:15px;white-space:normal;line-height:1.25}
.row .meta b{color:var(--fg);font-weight:600}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.room-pick{display:flex;gap:8px;flex-wrap:wrap}
.room-pick a{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit;text-decoration:none;font-weight:600}
.room-pick a.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* Recepció */
.rec-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:820px){.rec-layout{grid-template-columns:1fr}}
.qr-card{display:flex;gap:16px;align-items:center}
@media (min-width:821px){.rec-layout>section:first-child{grid-column:1;grid-row:1}.qr-card{grid-column:1;grid-row:2}.rec-list{grid-column:2;grid-row:1/span 2}}
.qr-card .qr{background:#fff;padding:8px;border-radius:10px;flex:none}
.qr-card .qr svg{display:block;width:140px;height:140px}
.links-a{font-weight:600;color:var(--ink);font-size:14px}
.pill.qr{background:var(--sage-soft);color:var(--sage)}
.ticket{margin-top:18px;border-radius:var(--r);background:var(--sage-soft);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ticket .code{font-size:54px;line-height:1;color:var(--ink)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}

/* Beállítások */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.room-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:480px){.room-edit{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.check input{margin-top:4px;accent-color:var(--sage);width:18px;height:18px}
.logo-prev{height:64px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;padding:8px;color:var(--muted);font-size:13px}
.logo-prev img{max-height:48px;max-width:100%}

/* ===== Váró-kijelző (TV): saját, mindig sötét megjelenés ===== */
.tv{--tv-bg:#a68a6f;--tv-bg2:#b39a80;--tv-gold:#fff3e0;--tv-fg:#ffffff;--tv-muted:#f7f0e8;--tv-sage:#fff3e0;--tv-line:rgba(255,255,255,.14);
  position:fixed;inset:0;background:radial-gradient(1200px 700px at 15% 0%,#c3af9a 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#957a5f 0%,transparent 60%),var(--tv-bg);
  color:var(--tv-fg);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;font-family:var(--body);color-scheme:dark;
  padding:calc(env(safe-area-inset-top,0px) + 2.2vw) max(2.6vw,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 1.6vw) max(2.6vw,env(safe-area-inset-left,0px))}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.tv-brand{display:flex;align-items:center;gap:1.2vw;min-width:0}
.tv-brand img{height:4.2vw;min-height:36px;max-width:22vw;object-fit:contain}
.tv-brand .mark{width:4.2vw;height:4.2vw;min-width:36px;min-height:36px;border-radius:1vw;background:rgba(255,255,255,.08)}
.tv-brand img.tv-lg{height:5.2vw;min-height:44px;max-width:none}.tv-lgsub{border-left:1px solid var(--tv-line);padding-left:1.2vw;margin:0!important}
.tv-brand .s{color:var(--tv-muted);font-size:clamp(12px,1.15vw,24px);margin-top:.2vw}
.tv-brand .n{font-family:var(--display);font-weight:700;font-size:clamp(18px,2vw,40px)}
.tv-clock{text-align:right}
.tv-clock .t{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.2vw,64px);font-variant-numeric:tabular-nums;line-height:1}
.tv-clock .d{color:var(--tv-muted);font-size:clamp(12px,1.2vw,24px);margin-top:.3vw}
.tv-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:2.4vw;padding:2.4vw 0;min-height:0}
@media (max-aspect-ratio:1/1){.tv-main{grid-template-columns:1fr;grid-template-rows:1.5fr 1fr}}
.tv-call{position:relative;border-radius:2vw;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--tv-line);
  display:flex;flex-direction:column;justify-content:center;padding:3vw 4vw;overflow:hidden;min-height:0}
.tv-label{font-size:clamp(13px,1.4vw,28px);letter-spacing:.14em;text-transform:uppercase;color:var(--tv-sage);font-weight:600}
.tv-code{font-family:var(--display);font-weight:700;font-size:clamp(70px,11.5vw,260px);white-space:nowrap;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:1vw 0 1.2vw}
.tv-time{color:var(--tv-gold);font-weight:700;font-size:1.35em}
.tv-initials{font-family:var(--display);font-size:clamp(18px,2.2vw,44px);color:var(--tv-muted);font-weight:600;margin-top:-.4vw;margin-bottom:1.2vw}
.tv-room{display:flex;align-items:center;gap:1.2vw;font-size:clamp(20px,3vw,60px);font-family:var(--display);font-weight:700}
.tv-room .arrow{width:clamp(26px,3.2vw,64px);height:clamp(26px,3.2vw,64px);border-radius:50%;background:var(--tv-sage);color:#24180f;display:grid;place-items:center;flex:none}
.tv-room .arrow svg{width:55%;height:55%}
.tv-room small{display:block;font-family:var(--body);font-weight:500;font-size:.45em;color:var(--tv-muted);margin-top:.2vw}
.tv-idle h2{font-size:clamp(32px,4.4vw,88px);font-weight:700;line-height:1.05;margin:1vw 0}
.tv-idle p{font-size:clamp(15px,1.6vw,32px);color:var(--tv-muted);max-width:30ch;margin:0}
.tv-call.flash{animation:flash 1.1s ease 3}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(209,171,114,0)}40%{box-shadow:0 0 0 .6vw rgba(209,171,114,.55);background-color:rgba(209,171,114,.12)}}
.tv-call .enter{animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(2vw)}to{opacity:1;transform:none}}
.tv-side{display:flex;flex-direction:column;gap:1.4vw;min-height:0}
.tv-side h3{font-size:clamp(13px,1.3vw,26px);letter-spacing:.12em;text-transform:uppercase;color:var(--tv-muted);font-weight:600;font-family:var(--body)}
.tv-hist{display:flex;flex-direction:column;gap:.8vw;overflow:hidden}
.tv-hist .it{display:flex;justify-content:space-between;align-items:center;gap:1vw;padding:1.1vw 1.6vw;border-radius:1.2vw;background:rgba(255,255,255,.05);border:1px solid var(--tv-line)}
.tv-hist .c{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.8vw,56px);font-variant-numeric:tabular-nums}
.tv-hist .r{color:var(--tv-muted);font-size:clamp(13px,1.5vw,30px);text-align:right}
.tv-hist .none{color:var(--tv-muted);font-size:clamp(13px,1.4vw,28px)}
.tv-qr{margin-top:auto;display:flex;gap:1.4vw;align-items:center;padding:1.2vw;border-radius:1.2vw;background:rgba(255,255,255,.05);border:1px solid var(--tv-line)}
.tv-qr .qr{background:#fff;padding:.6vw;border-radius:.8vw;flex:none;width:calc(9vw + 1.2vw);min-width:96px}
.tv-qr .qr svg{width:100%;height:auto;display:block}
.tv-qr b{display:block;font-family:var(--display);font-size:clamp(14px,1.5vw,30px)}
.tv-qr span{color:var(--tv-muted);font-size:clamp(11px,1.05vw,21px);line-height:1.35}
.tv-hist{flex:0 1 auto}
.tv-foot{display:flex;justify-content:space-between;align-items:center;gap:2vw;border-top:1px solid var(--tv-line);padding-top:1.4vw;color:var(--tv-muted);font-size:clamp(12px,1.3vw,26px)}
.tv-foot .wait b{color:var(--tv-fg);font-family:var(--display);font-size:1.3em}
.tv-tip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .6s}
.tv-start{position:fixed;inset:0;z-index:20;background:rgba(24,16,10,.84);backdrop-filter:blur(6px);display:grid;place-items:center;text-align:center;color:#f8f1e7;padding:24px}
.tv-start h2{font-size:clamp(24px,3vw,44px);margin-bottom:10px}
.tv-start p{color:#bfae99;max-width:46ch;margin:0 auto 22px}
.tv-start .btn{background:#d1ab72;color:#24180f;font-size:18px;padding:16px 28px}
.tv-exit{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));opacity:0;transition:opacity .3s;z-index:5;font-size:12px;color:#bfae99;text-decoration:none;background:rgba(255,255,255,.06);padding:6px 10px;border-radius:8px}
.tv:hover .tv-exit,.tv-exit:focus{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* TV – weboldal stílus: fehér hívókártya, világos fejléc-sáv, ZS vízjel, bronz kiemelések */
.tv{background:
  linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%),
  radial-gradient(1100px 700px at 10% 0%,#cbb8a3 0%,transparent 60%),
  radial-gradient(900px 600px at 100% 100%,#8f735a 0%,transparent 60%),var(--tv-bg)}
.tv::before{content:"";position:absolute;inset:0;background:url(/mark-light.png) no-repeat right -4vw bottom -6vw / 46vw auto;opacity:.13;pointer-events:none}
.tv>.tv-top,.tv>.tv-main,.tv>.tv-foot{position:relative;z-index:1}
.tv-top{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);border-radius:1.4vw;padding:1vw 1.8vw;backdrop-filter:blur(6px)}
.tv-call{background:#fff;color:#3a312a;border:0;box-shadow:0 1.6vw 4vw rgba(70,48,28,.22)}
.tv-call::before{content:"";position:absolute;left:4vw;top:0;width:7vw;height:.45vw;background:#9a734a;border-radius:0 0 .4vw .4vw}
.tv-call .tv-label{color:#9a734a}
.tv-call .tv-code{color:#9a734a}
.tv-call .tv-initials{color:#8a7d72}
.tv-call .tv-time{color:#3a312a}
.tv-call .tv-room{color:#3a312a}
.tv-call .tv-room .arrow{background:#9a734a;color:#fff}
.tv-call .tv-room small{color:#8a7d72}
.tv-call .tv-idle h2{color:#3a312a}.tv-call .tv-idle p{color:#8a7d72}
@keyframes flash{0%,100%{box-shadow:0 1.6vw 4vw rgba(70,48,28,.22)}40%{box-shadow:0 0 0 .7vw rgba(255,255,255,.75),0 1.6vw 4vw rgba(70,48,28,.3)}}
.tv-side h3{color:#fff}
.tv-hist .it{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}
.tv-hist .it:first-child{background:rgba(255,255,255,.34)}
.tv-qr{background:#fff;color:#3a312a;border:0;box-shadow:0 1vw 2.6vw rgba(70,48,28,.18)}
.tv-qr b{color:#9a734a}.tv-qr span{color:#8a7d72}
.tv-foot{border-top:0;background:rgba(74,56,40,.32);border-radius:1.2vw;padding:1vw 1.8vw;color:#fff}
.tv-foot .wait b{color:#fff}

/* Bejelentkező tablet (#bejelentkezes) */
.ki{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding:4vh 5vw;gap:3vh;color:var(--fg)}
.ki-top{display:flex;justify-content:space-between;align-items:center}
.ki h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,52px);line-height:1.1;margin:0;color:var(--ink)}
.ki p.lead{font-size:clamp(18px,2.4vw,26px);color:var(--muted);margin:0}
.ki-big{display:grid;grid-template-columns:1fr 1fr;gap:3vw;flex:1;max-height:52vh}
.ki-btn{border:0;border-radius:24px;font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,44px);line-height:1.15;padding:4vh 3vw;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5vh;text-align:center;color:#fff;background:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.ki-btn small{font-family:var(--body);font-weight:500;font-size:clamp(15px,1.8vw,21px);opacity:.85}
.ki-btn.alt{background:var(--sage)}
.ki-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ki-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-content:start}
.ki-slot{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:22px 12px;font-family:var(--display);font-weight:700;font-size:40px;color:var(--fg);cursor:pointer}
.ki-slot span{display:block;font-family:var(--body);font-weight:600;font-size:20px;color:var(--muted);margin-top:4px}
.ki-back{align-self:flex-start;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:14px 26px;font-size:22px;font-weight:600;cursor:pointer}
.ki-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
.ki-done .num{font-family:var(--display);font-weight:700;font-size:clamp(72px,13vw,160px);line-height:1;color:var(--ink)}
.ki-wait{display:flex;align-items:center;gap:3vw;background:var(--sage-soft);border:2px solid var(--sage);border-radius:24px;padding:2.4vh 3vw;margin-top:2vh;text-align:left;font-size:clamp(18px,2.3vw,26px);line-height:1.35;color:var(--fg);max-width:900px}
.ki-wait b{color:var(--ink)}
.ki-arrow{flex:none;width:clamp(90px,12vw,150px);height:clamp(90px,12vw,150px);border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center}
.ki-arrow svg{width:62%;height:62%;transform:rotate(var(--a));animation:kiNudge 1.4s ease-in-out infinite}
@keyframes kiNudge{0%,100%{translate:0 0}50%{translate:calc(cos(var(--a))*10px) calc(sin(var(--a))*10px)}}
@media (prefers-reduced-motion:reduce){.ki-arrow svg{animation:none}}
@media (max-width:700px){.ki-big{grid-template-columns:1fr;max-height:none}}
</style>

</head><body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
/* ---------- segédek ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(3, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const hhmm = t => t ? new Date(t).toLocaleTimeString("hu-HU", {hour:"2-digit", minute:"2-digit"}) : "";
const uid = () => Math.random().toString(36).slice(2, 10);
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const ICON = {
  cross:'<svg viewBox="0 0 24 24" fill="none"><path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z" fill="#fff"/></svg>',
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3v6a5 5 0 0 0 10 0V3"/><path d="M11 14v2a4 4 0 0 0 8 0v-2"/><circle cx="19" cy="12" r="2"/></svg>',
  desk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16v4H4z"/><path d="M6 11v8M18 11v8M9 7V4h6v3"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'
};

const DEFAULT_SETTINGS = {
  clinicName: "Dr. Zsákai Zsolt",
  clinicSub: "Ortopéd Sebészeti Magánrendelés",
  prefix: "ZS",
  rooms: [{id:1, name:"Rendelő", doctor:""}],
  showReception: false,
  showInitials: false,
  speech: true,
  gong: true,
  showQr: true,
  kioskArrow: "right",
  logo: ""
};

/* ---------- adattár: a saját szerver API-ja ---------- */
const Store = (() => {
  let pin = lsGet("bh-pin", ""), state = null, mode = "connecting", timer = null, interval = 4000, skew = 0, lastS = "";
  const subs = { patients: new Set(), settings: new Set() };
  const emitP = () => [...subs.patients].forEach(f => subs.patients.has(f) && f(state.patients));
  const emitS = () => [...subs.settings].forEach(f => subs.settings.has(f) && f(state.settings));
  async function api(path, opts = {}) {
    const r = await fetch(path, Object.assign({}, opts, { headers: { "Content-Type": "application/json", "x-pin": pin } }));
    if (r.status === 401) { const j = await r.json().catch(() => ({})); const was = mode; mode = j.error === "setup" ? "setup" : "login"; if (was !== mode) route(); throw new Error("pin"); }
    if (r.status === 503) { const was = mode; mode = "nodb"; if (was !== "nodb") route(); throw new Error("nodb"); }
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }
  function apply(st) {
    const first = !state; skew = st.now - Date.now(); state = st;
    const k = JSON.stringify(st.settings);
    if (first || k !== lastS) { lastS = k; emitS(); }
    emitP();
  }
  async function poll() {
    clearTimeout(timer);
    try { const st = await api("/api/state"); const was = mode; mode = "shared"; apply(st); if (was !== "shared") route(); }
    catch (e) { if (mode === "login" || mode === "nodb" || mode === "setup") return; }
    timer = setTimeout(poll, document.hidden ? 15000 : interval);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && mode === "shared") poll(); });
  async function act(a) { const j = await api("/api/action", { method: "POST", body: JSON.stringify(a) }); apply(j.state); return j.result; }
  return {
    init: async () => { await poll(); },
    login: async p => { pin = p; lsSet("bh-pin", p); mode = "connecting"; await poll(); return mode === "shared"; },
    logout: () => { pin = ""; lsSet("bh-pin", ""); mode = "login"; clearTimeout(timer); route(); },
    setInterval: ms => { interval = ms; },
    act, now: () => Date.now() + skew,
    updatePatient: (id, patch) => act({ type: patch.status === "waiting" ? "back" : "unknown", id }),
    deletePatient: id => act({ type: "delete", id }),
    saveSettings: s => act({ type: "settings", settings: s }),
    get mode() { return mode; }, get loaded() { return !!state; }, get qrToken() { return state ? state.qrToken : ""; }, get syncErr() { return state ? state.syncErr : null; },
    get patients() { return state ? state.patients : []; }, get settings() { return state ? state.settings : DEFAULT_SETTINGS; },
    onPatients(f) { subs.patients.add(f); return () => subs.patients.delete(f); },
    onSettings(f) { subs.settings.add(f); return () => subs.settings.delete(f); }
  };
})();
const checkinUrl = () => location.origin + "/beteg.html?t=" + Store.qrToken;
function drawQr(el, size, dark) {
  if (!el || !window.qrcode || !Store.qrToken) return;
  const url = checkinUrl(); if (el.dataset.url === url) return;
  el.dataset.url = url;
  const q = qrcode(0, "M"); q.addData(url); q.make();
  el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }).replace(/fill="black"/g, 'fill="' + dark + '"');
}

/* ---------- sor-logika ---------- */
const S = () => Store.settings;
const roomOf = id => S().rooms.find(r => r.id === id);
const roomName = id => (roomOf(id) || {name: id ? id + ". rendelő" : "Bármelyik rendelő"}).name;
const sortKey = p => p.apptAt || p.createdAt;
const byNum = (a, b) => sortKey(a) - sortKey(b) || a.num - b.num;
const waitingFor = (list, roomId) => list.filter(p => p.status === "waiting" && (!p.room || p.room === roomId)).sort(byNum);
const calledIn = (list, roomId) => list.filter(p => p.status === "called" && p.calledRoom === roomId).sort((a,b) => b.calledAt - a.calledAt)[0];
const issueTicket = (initials, room) => Store.act({ type: "issue", initials, room });
const callNext = (room, missed) => Store.act({ type: missed ? "skip" : "next", room });
const recall = p => Store.act({ type: "recall", id: p.id });
const callSpecific = (p, room) => Store.act({ type: "call", id: p.id, room });

/* ---------- hang: gong + magyar bemondás ---------- */
const Sound = (() => {
  let ctx = null;
  const unlock = () => { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {} };
  function tone(freq, start, dur, vol) {
    [1, 2.01, 3.02].forEach((h, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq * h;
      const v = vol * [1, .28, .1][i];
      g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(v, start + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g).connect(ctx.destination); o.start(start); o.stop(start + dur + .05);
    });
  }
  function gong() { if (!ctx) return; const t = ctx.currentTime + .05; tone(659.25, t, 1.8, .35); tone(523.25, t + .55, 2.4, .32); }
  function say(text) {
    try {
      const ss = window.speechSynthesis; if (!ss) return;
      const u = new SpeechSynthesisUtterance(text); u.lang = "hu-HU"; u.rate = .92;
      const v = ss.getVoices().find(v => /^hu/i.test(v.lang)); if (v) u.voice = v;
      ss.cancel(); ss.speak(u);
    } catch {}
  }
  return { unlock, gong, say, get ready() { return !!ctx && ctx.state === "running"; } };
})();
function spoken(p) {
  const name = roomName(p.calledRoom);
  const code = p.code.replace("-", " ").replace(/\b0+(\d)/, "$1").replace(/^ZS\b/i, "Zsé");
  const where = /rendelő$/i.test(name) ? "a " + (name === "Rendelő" ? "rendelő" : name) + "be" : name;
  if (p.time) { const [hh, mm] = p.time.split(":").map(Number); return `${code}. A ${mm ? hh + " óra " + mm + " perces" : hh + " órás"} időpontra érkezett beteget kérjük, fáradjon ${where}.`; }
  return `${code}. Kérjük, fáradjon ${where}.`;
}

/* ---------- közös fejléc ---------- */
function brandHTML(sub) {
  const s = S();
  if (!s.logo) return `<div class="brand"><img class="lg lg-l" src="/logo-brown.png" alt="${esc(s.clinicName)}"><img class="lg lg-d" src="/logo-gold.png" alt="${esc(s.clinicName)}">${sub ? `<div class="brand-sub lg-sub">${esc(sub)}</div>` : ""}</div>`;
  const logo = `<img src="${esc(s.logo)}" alt="">`;
  return `<div class="brand">${logo}<div style="min-width:0"><div class="brand-name">${esc(s.clinicName)}</div><div class="brand-sub">${esc(sub)}</div></div></div>`;
}
function shell(active, sub, inner) {
  const nav = [["", "Kezdőlap"], ["kijelzo", "Váró-kijelző"], ["orvos", "Orvos"], ...(S().showReception || active === "recepcio" ? [["recepcio", "Recepció"]] : []), ["beallitasok", "Beállítások"]]
    .map(([h, l]) => `<a href="#${h}" class="${active === h ? "on" : ""}">${l}</a>`).join("") + `<a href="#kilepes">Kilépés</a>`;
  const banner = "";
  return `<div class="wrap"><header class="top">${brandHTML(sub)}<nav class="nav">${nav}</nav></header>${banner}${inner}</div>`;
}

/* ---------- nézetek ---------- */
let cleanup = [];
const app = $("#app");
function on(fnP, fnS) { if (fnP) cleanup.push(Store.onPatients(fnP)); if (fnS) cleanup.push(Store.onSettings(fnS)); }

function viewHome() {
  const rooms = S().rooms.map(r => `<a href="#orvos-${r.id}">${esc(r.name)}</a>`).join("");
  app.innerHTML = shell("", S().clinicSub || "Betegbehívó rendszer", `
    <div class="eyebrow">Betegbehívó</div>
    <h1 class="hero-h">Nyugodt váróterem, egy gombnyomásos behívás.</h1>
    <p class="muted" style="max-width:62ch;margin:0">Nyisd meg a kijelzőt a váróbeli TV-n, az orvosi felületet a rendelő gépén. A betegek a kijelzőn látható QR-kóddal maguk kérnek sorszámot, a kettő valós időben látja egymást.</p>
    <div class="tiles">
      <a class="tile" href="#kijelzo"><div class="ico">${ICON.tv}</div><h3>Váró-kijelző</h3><p class="muted" style="margin:0">Teljes képernyős nézet a TV-re. Gong és magyar bemondás hívásnál, csak a sorszám és az időpont látszik.</p></a>
      <div class="tile"><div class="ico">${ICON.doc}</div><h3>Orvosi felület</h3><p class="muted" style="margin:0">Következő, Újrahívás, Nem jelent meg${S().rooms.length > 1 ? ". Válaszd ki a rendelőt:" : ", és kézzel is adhatsz ki sorszámot."}</p>${S().rooms.length > 1 ? `<div class="links">${rooms}</div>` : `<div class="links"><a href="#orvos-${S().rooms[0].id}">Megnyitás</a></div>`}</div>
      <a class="tile" href="#bejelentkezes"><div class="ico">${ICON.desk}</div><h3>Bejelentkező tablet</h3><p class="muted" style="margin:0">Az ajtónál, telefon nélküli betegeknek: időpontra érkezés jelzése vagy sorszám kérése két nagy gombbal.</p></a>
      <a class="tile" href="#recepcio" ${S().showReception ? "" : "hidden"}><div class="ico">${ICON.desk}</div><h3>Recepció</h3><p class="muted" style="margin:0">Érkező beteg rögzítése, sorszám kiadása, a napi sor áttekintése.</p></a>
    </div>
    <div class="steps">
      <div class="card"><div class="eyebrow">Kipróbálás</div><p>Olvasd be telefonnal a kijelzőn látható QR-kódot, és kérj sorszámot. Az Orvos nézetben a „Következő beteg” gombbal hívd be, a kijelzőn és a telefonon is megjelenik.</p></div>
      <div class="card"><div class="eyebrow">Adatvédelem</div><p>A kijelzőn csak a sorszám és az időpont jelenik meg. Teljes nevet és egészségügyi adatot a rendszer nem tárol, a régi napok sorai automatikusan törlődnek.</p></div>
      <div class="card"><div class="eyebrow">Arculat</div><p>A Beállításokban feltölthető a logó, átírható a rendelő neve és a rendelők listája.</p></div>
    </div>`);
  on(null, route);
}

/* Váró-kijelző */
const TIPS = ["Kérjük, sorszámát tartsa magánál, és figyelje a kijelzőt.",
  "Kérjük, a rendelőbe lépés előtt némítsa le telefonját.",
  "Napi legalább 30 perc séta sokat tesz a szív egészségéért.",
  "Igyon elegendő vizet: felnőtteknek napi 1,5–2 liter ajánlott.",
  "Ha rosszul érzi magát várakozás közben, kérjük, szóljon a recepción."];
function viewDisplay() {
  document.documentElement.style.background = "#24180f";
  app.innerHTML = `<div class="tv" id="tv">
    <div class="tv-top"><div class="tv-brand" id="tvBrand"></div><div class="tv-clock"><div class="t" id="tvTime"></div><div class="d" id="tvDate"></div></div></div>
    <div class="tv-main"><section class="tv-call" id="tvCall" aria-live="assertive"></section>
      <aside class="tv-side"><h3>Korábbi hívások</h3><div class="tv-hist" id="tvHist"></div><div class="tv-qr" id="tvQrBox"><div class="qr" id="tvQr"></div><div><b>Sorszám mobilon</b><span>Olvassa be a kódot a telefonjával, és kövesse ott, mikor kerül sorra.</span></div></div></aside></div>
    <div class="tv-foot"><div class="tv-tip" id="tvTip"></div><div class="wait" id="tvWait"></div></div>
    <a class="tv-exit" href="#">Kilépés a kijelzőből</a>
  </div>
  ${Sound.ready ? "" : `<div class="tv-start" id="tvStart"><div><h2>Váró-kijelző indítása</h2><p>A böngésző csak egy kattintás után engedi a hangot. Az indítás teljes képernyőre vált, és ébren tartja a kijelzőt.</p><button class="btn" id="tvGo">Kijelző indítása</button></div></div>`}`;

  let wake = null;
  const go = $("#tvGo");
  if (go) go.onclick = async () => {
    Sound.unlock(); $("#tvStart").remove();
    try { await document.documentElement.requestFullscreen?.(); } catch {}
    try { wake = await navigator.wakeLock?.request("screen"); } catch {}
    try { window.speechSynthesis?.getVoices(); } catch {}
  };
  cleanup.push(() => { try { wake && wake.release(); } catch {} document.documentElement.style.background = ""; if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); });

  const tick = () => {
    const d = new Date();
    $("#tvTime").textContent = d.toLocaleTimeString("hu-HU", {hour:"2-digit", minute:"2-digit"});
    $("#tvDate").textContent = d.toLocaleDateString("hu-HU", {weekday:"long", month:"long", day:"numeric"});
  };
  tick(); const ti = setInterval(tick, 5000);
  let tipI = 0; const tipEl = $("#tvTip"); tipEl.textContent = TIPS[0];
  const tt = setInterval(() => { tipEl.style.opacity = 0; setTimeout(() => { tipI = (tipI + 1) % TIPS.length; tipEl.textContent = TIPS[tipI]; tipEl.style.opacity = 1; }, 600); }, 12000);
  cleanup.push(() => { clearInterval(ti); clearInterval(tt); });

  const seen = new Map(); let primed = false, lastShownKey = "";
  function brand() {
    const s = S();
    $("#tvBrand").innerHTML = !s.logo ? `<img class="tv-lg" src="/logo-light.png" alt="${esc(s.clinicName)}">${s.clinicSub ? `<div class="s tv-lgsub">${esc(s.clinicSub)}</div>` : ""}` : (s.logo ? `<img src="${esc(s.logo)}" alt="">` : `<div class="mark">${ICON.cross}</div>`) + `<div><div class="n">${esc(s.clinicName)}</div>${s.clinicSub ? `<div class="s">${esc(s.clinicSub)}</div>` : ""}</div>`;
  }
  function render(list, announce) {
    const s = S();
    const called = list.filter(p => p.calledAt && (p.status === "called" || p.status === "done" || p.status === "missed")).sort((a, b) => b.calledAt - a.calledAt);
    const active = list.filter(p => p.status === "called").sort((a, b) => b.calledAt - a.calledAt);
    const hero = active[0];
    const box = $("#tvCall");
    const key = hero ? hero.id + ":" + hero.calledAt : "idle";
    if (key !== lastShownKey) {
      lastShownKey = key;
      if (hero) {
        const room = roomOf(hero.calledRoom);
        box.innerHTML = `<div class="enter"><div class="tv-label">Behívjuk</div>
          <div class="tv-code">${esc(hero.code)}</div>
          ${hero.time || (s.showInitials && hero.initials) ? `<div class="tv-initials">${hero.time ? `<span class="tv-time">${esc(hero.time)}</span>-as időpont` : ""}${hero.time && s.showInitials && hero.initials ? " · " : ""}${s.showInitials && hero.initials ? esc(hero.initials) : ""}</div>` : ""}
          <div class="tv-room"><span class="arrow">${ICON.arrow}</span><div>${esc(roomName(hero.calledRoom))}${room && room.doctor ? `<small>${esc(room.doctor)}</small>` : ""}</div></div></div>`;
      } else {
        box.innerHTML = `<div class="enter tv-idle"><div class="tv-label">Üdvözöljük</div><h2>Kérjük, foglaljon helyet.</h2><p>Hamarosan behívjuk. Sorszáma itt fog megjelenni.</p></div>`;
      }
    }
    if (announce && hero) { box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash"); }
    const hist = called.filter(p => p !== hero).slice(0, S().showQr ? 3 : 5);
    $("#tvHist").innerHTML = hist.length ? hist.map(p => `<div class="it"><span class="c">${esc(p.code)}</span><span class="r">${p.time ? esc(p.time) + "-as időpont" : esc(roomName(p.calledRoom))}<br>hívva ${hhmm(p.calledAt)}</span></div>`).join("") : `<div class="none">Még nem volt hívás ma.</div>`;
    const w = list.filter(p => p.status === "waiting").length;
    $("#tvWait").innerHTML = `Várakozik: <b>${w}</b>`;
  }
  const announceQ = []; let speaking = false;
  function runQ() {
    if (speaking || !announceQ.length) return;
    speaking = true; const p = announceQ.shift(); const s = S();
    if (s.gong) Sound.gong();
    setTimeout(() => { if (s.speech) Sound.say(spoken(p)); }, s.gong ? 1500 : 0);
    setTimeout(() => { speaking = false; runQ(); }, 6500);
  }
  function onList(list) {
    let fresh = false;
    for (const p of list) {
      if (p.status !== "called" || !p.calledAt) continue;
      const prev = seen.get(p.id) || 0;
      if (p.calledAt > prev) {
        seen.set(p.id, p.calledAt);
        if (primed && Store.now() - p.calledAt < 120000) { fresh = true; announceQ.push(p); }
      }
    }
    primed = true;
    render(list, fresh); if (fresh) runQ();
  }
  Store.setInterval(2500); cleanup.push(() => Store.setInterval(4000));
  const qr = () => { const on = S().showQr; $("#tvQrBox").hidden = !on; if (on) drawQr($("#tvQr"), 240, "#24180f", "#ffffff"); };
  brand(); qr(); on(qr, qr);
  if (Store.loaded) onList(Store.patients); else render([], false);
  on(onList, () => { brand(); lastShownKey = ""; render(Store.patients, false); });
}

/* Orvosi felület */
function viewDoctor(roomId) {
  const rooms = S().rooms;
  if ((!roomId || !roomOf(roomId)) && rooms.length === 1) roomId = rooms[0].id;
  if (!roomId || !roomOf(roomId)) {
    app.innerHTML = shell("orvos", "Orvosi felület", `<div class="card"><h2 style="font-size:22px;margin-bottom:6px">Melyik rendelő?</h2><p class="muted" style="margin:0 0 16px">Ezt a választást érdemes könyvjelzőzni a rendelő gépén vagy tabletjén.</p><div class="room-pick">${rooms.map(r => `<a href="#orvos-${r.id}">${esc(r.name)}${r.doctor ? ` · <span class="muted">${esc(r.doctor)}</span>` : ""}</a>`).join("")}</div></div>`);
    on(null, route); return;
  }

  $("#bAdd").onclick = () => act(() => issueTicket("", rooms.length > 1 ? roomId : 0), r => r ? r.code + " kiadva" : "");
  $("#bRe").onclick = () => { const c = calledIn(Store.patients, roomId); if (c) act(() => recall(c), c.code + " újrahívva"); };
  function draw(list) {

    $("#bNext").disabled = busy || !q.length && !c;
    $("#bNext").textContent = c && !q.length ? "Kész, nincs több beteg" : "Következő beteg";
    $("#bRe").disabled = busy || !c; $("#bSkip").disabled = busy || !c;
    const nx = q[0];
    $("#hint").textContent = nx ? `Következő: ${nx.code}${nx.name || nx.initials ? " (" + (nx.name || nx.initials) + ")" : ""}${nx.time ? " · " + nx.time : ""}${nx.arrived === false ? " · még nem jelezte, hogy megérkezett" : ""}` : "A sor üres.";
    $("#q").innerHTML = q.length ? q.slice(0, 30).map(p => `<div class="row"><span class="code">${esc(p.code)}</span><span class="meta"><b>${esc(p.name || p.initials || "Időpont nélkül")}</b>${p.time ? "időpont " + esc(p.time) : "érkezett " + hhmm(p.createdAt)}${p.room || rooms.length < 2 ? "" : " · bármelyik rendelő"}</span><div class="row-actions">${p.arrived === false ? `<button class="btn small ghost" data-arr="${esc(p.id)}" title="Kattints rá, ha a beteg megérkezett">Még nincs itt</button>` : p.src === "cal" ? `<button class="pill waiting" style="border:0;cursor:pointer" data-arr="${esc(p.id)}" title="Visszavonás">Megérkezett</button>` : ""}<button class="btn small ghost" data-call="${esc(p.id)}">Behívás</button></div></div>`).join("") : `<p class="muted" style="margin:8px 0 0">Jelenleg senki nem vár.${S().icalUrl ? "" : " A naptár még nincs összekötve (Beállítások)."}</p>`;
    $("#syncNote").textContent = Store.syncErr ? "A naptárat most nem sikerült kiolvasni, a lista a legutóbbi állapotot mutatja." : "";

  draw(Store.patients);
  on(draw, route);
}

function viewReception() {
  const s = S();
  app.innerHTML = shell("recepcio", "Recepció", `
    <div class="rec-layout">
      <section class="card">
        <h2 style="font-size:22px;margin-bottom:4px">Beteg érkeztetése</h2>
        <p class="muted" style="margin:0 0 18px;font-size:14px">Teljes nevet nem kell megadni. A monogram segít a rendelőnek. Hogy a kijelzőn is látsszon-e, a Beállításokban választhatod meg.</p>
        <form id="f" class="grid">
          <div class="field"><label for="ini">Monogram (nem kötelező)</label><input type="text" id="ini" maxlength="4" placeholder="pl. K. A." autocomplete="off"></div>
          <div class="field"><label for="rm">Rendelő</label><select id="rm"><option value="0">Bármelyik szabad rendelő</option>${s.rooms.map(r => `<option value="${r.id}">${esc(r.name)}${r.doctor ? " · " + esc(r.doctor) : ""}</option>`).join("")}</select></div>
          <button class="btn primary" type="submit" style="padding:15px">Sorszám kiadása</button>
        </form>
        <div id="tk"></div>
      </section>
      <section class="card qr-card"><div class="qr" id="recQr"></div><div><div class="eyebrow">Mobilos bejelentkezés</div><p class="muted" style="margin:6px 0 10px;font-size:14px">A betegek ezzel a kóddal maguk kérhetnek sorszámot. A kód minden nap megújul, ugyanez látszik a váró-kijelzőn is.</p><a class="links-a" id="recQrLink" target="_blank" rel="noopener">Betegoldal megnyitása</a></div></section>
      <section class="card rec-list">
        <div class="stats" id="st"></div>
        <div class="tabs" id="tabs"><button data-t="active" class="on">Aktív sor</button><button data-t="all">Mai összes</button></div>
        <div class="list" id="ql"></div>
      </section>
    </div>`);
  let tab = "active";
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const ini = $("#ini").value.trim().toUpperCase(), room = +$("#rm").value;
    const btn = e.submitter || $("#f button"); btn.disabled = true;
    try {
      const p = await issueTicket(ini, room);
      const ahead = waitingFor(Store.patients, room || (s.rooms[0] && s.rooms[0].id)).filter(x => x.num < p.num).length;
      $("#tk").innerHTML = `<div class="ticket"><div><div class="eyebrow">Kiadott sorszám</div><div class="code">${esc(p.code)}</div></div><div style="text-align:right"><div style="font-weight:600">${esc(room ? roomName(room) : "Bármelyik rendelő")}</div><div class="muted" style="font-size:13px">${ahead ? ahead + " beteg vár előtte" : "Nincs előtte várakozó"}</div></div></div>`;
      $("#ini").value = ""; $("#ini").focus();
    } catch (err) { console.warn(err); toast("Nem sikerült a sorszámot kiadni."); }
    btn.disabled = false;
  };
  $("#tabs").onclick = e => { const t = e.target.dataset.t; if (!t) return; tab = t; [...$("#tabs").children].forEach(b => b.classList.toggle("on", b.dataset.t === t)); draw(Store.patients); };
  const LBL = {waiting: "Várakozik", called: "Behívva", done: "Ellátva", missed: "Nem jelent meg"};
  function draw(list) {
    const c = st => list.filter(p => p.status === st).length;
    $("#st").innerHTML = [["waiting", "Várakozik"], ["called", "Bent van"], ["done", "Ellátva"], ["missed", "Nem jelent meg"]].map(([k, l]) => `<div class="stat"><b>${c(k)}</b><span>${l}</span></div>`).join("");
    const rows = (tab === "active" ? list.filter(p => p.status === "waiting" || p.status === "called" || p.status === "missed") : list.slice()).sort(byNum);
    $("#ql").innerHTML = rows.length ? rows.map(p => {
      const where = p.status === "called" || p.status === "done" ? roomName(p.calledRoom) : (p.room ? roomName(p.room) : "Bármelyik");
      const acts = p.status === "missed" ? `<button class="btn small ghost" data-a="back" data-id="${esc(p.id)}">Vissza a sorba</button>`
        : p.status === "waiting" ? `<button class="btn small ghost" data-a="del" data-id="${esc(p.id)}">Törlés</button>` : "";
      return `<div class="row"><span class="code">${esc(p.code)}</span><span class="meta"><b>${esc(p.name || p.initials || "Időpont nélkül")}</b>${esc(where)} · ${hhmm(p.createdAt)}${p.src === "qr" ? " · mobilról" : ""}</span><div class="row-actions"><span class="pill ${p.status}">${LBL[p.status]}</span>${acts}</div></div>`;
    }).join("") : `<p class="muted" style="margin:8px 0 0">${tab === "active" ? "Most senki nem vár. Az első érkező sorszámát bal oldalt tudod kiadni." : "Ma még nem volt beteg."}</p>`;
  }
  const pendingDel = new Set();
  $("#ql").onclick = async e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.a === "back") { await Store.updatePatient(id, {status: "waiting", calledRoom: 0}); toast("Visszakerült a sorba"); }
    if (b.dataset.a === "del") {
      if (!pendingDel.has(id)) { pendingDel.add(id); b.textContent = "Biztosan?"; setTimeout(() => { pendingDel.delete(id); if (b.isConnected) b.textContent = "Törlés"; }, 3000); return; }
      await Store.deletePatient(id); toast("Törölve");
    }
  };
  draw(Store.patients);
  const q = () => { drawQr($("#recQr"), 140, "#1c3a4b", "#ffffff"); $("#recQrLink").href = checkinUrl(); };
  q(); on(draw, null); on(q, null);
}

function viewNoDb() {
  fetch("/api/health").then(r => r.json()).then(j => { const el = $("#dbdiag"); if (el) el.textContent = "Talált beállítások: " + (j.keys.length ? j.keys.join(", ") : "nincs") + (j.ping ? " · " + j.ping : ""); }).catch(() => {});
  app.innerHTML = `<div class="wrap" style="max-width:560px;padding-top:12vh"><div class="card grid"><h1 style="font-size:22px">Az adatbázis még nincs bekötve</h1><p class="muted" style="margin:0">Az alkalmazás fut, de még nincs hova mentenie a sort. Ha a tárhelyen bekötötted az adatbázist, frissítsd az oldalt.</p><button class="btn primary" onclick="location.reload()">Újrapróbálás</button><p class="muted" id="dbdiag" style="margin:0;font-size:12px"></p></div></div>`;
}


/* Bejelentkező tablet az ajtónál: telefon nélküli betegeknek */
function viewKiosk() {
  let screen = "home", timer = null, msg = null;
  const s = S();
  const head = () => `<div class="ki-top">${brandHTML(s.clinicSub || "")}<button class="ki-back" id="kFs" style="font-size:16px;padding:10px 16px">Teljes képernyő</button></div>`;
  const back = () => { screen = "home"; draw(); };
  const ANG = { right: 0, downright: 45, down: 90, downleft: 135, left: 180, upleft: -135, up: -90, upright: -45 };
  const toWait = () => { const dir = S().kioskArrow || "right", left = /left/.test(dir);
    const arrow = `<div class="ki-arrow" style="--a:${ANG[dir] ?? 0}deg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>`;
    return `<div class="ki-wait ${left ? "l" : ""}">${left ? arrow : ""}<div><b>Kérjük, fáradjon be a váróterembe,</b><br>és foglaljon helyet. A hívást ott a kijelzőn és hangosan is jelezzük.</div>${left ? "" : arrow}</div>`; };
  const later = (ms) => { clearTimeout(timer); timer = setTimeout(back, ms); };
  const open = () => Store.patients.filter(p => p.src === "cal" && p.arrived === false && p.status === "waiting").sort((a, b) => (a.apptAt || 0) - (b.apptAt || 0));
  function draw() {
    let body = "";
    if (screen === "home") {
      clearTimeout(timer);
      body = `<div><h1>Jó napot kívánunk!</h1><p class="lead">Kérjük, jelezze, hogy megérkezett.</p></div>
        <div class="ki-big"><button class="ki-btn" data-go="appt">Időpontra jöttem<small>Válassza ki az időpontját</small></button><button class="ki-btn alt" data-go="walk">Időpont nélkül jöttem<small>Sorszámot kap</small></button></div>`;
    } else if (screen === "appt") {
      later(45000);
      const L = open();
      body = `<button class="ki-back" data-go="home">‹ Vissza</button><div><h1>Melyik az Ön időpontja?</h1><p class="lead">Érintse meg a saját időpontját.</p></div>
        ${L.length ? `<div class="ki-slots">${L.map(p => `<button class="ki-slot" data-arr="${esc(p.id)}">${esc(p.time || "")}${s.showInitials && p.initials ? `<span>${esc(p.initials)}</span>` : ""}</button>`).join("")}</div>` : `<p class="lead">Nincs több mai időpont a listában. Kérjük, válassza az „Időpont nélkül jöttem” lehetőséget, vagy szóljon az orvosnak.</p>`}`;
    } else if (screen === "walk") {
      later(30000);
      body = `<button class="ki-back" data-go="home">‹ Vissza</button><div class="ki-done"><h1>Sorszámot kér?</h1><p class="lead">Ha előre egyeztetett időpontja van, lépjen vissza, és válassza az „Időpontra jöttem” gombot.</p>
        <button class="ki-btn alt" data-go="issue" style="max-width:520px;width:100%;margin-top:2vh">Igen, kérek sorszámot</button></div>`;
    } else if (screen === "done") {
      later(25000);
      body = `<div class="ki-done">${msg}<button class="ki-back" data-go="home" style="align-self:center;margin-top:3vh">Rendben</button></div>`;
    }
    app.innerHTML = `<div class="ki">${head()}${body}</div>`;
  }
  let busy = false;
  app.onclick = async e => {
    if (e.target.closest("#kFs")) { try { await document.documentElement.requestFullscreen?.(); } catch {} return; }
    const go = e.target.closest("[data-go]")?.dataset.go, ar = e.target.closest("[data-arr]")?.dataset.arr;
    if (busy || (!go && !ar)) return;
    if (go === "issue") {
      busy = true;
      try { const r = await issueTicket("", 0); msg = `<p class="lead">Az Ön sorszáma:</p><div class="num">${esc(r.code)}</div><p class="lead" style="max-width:34ch">Kérjük, jegyezze meg. Szólítjuk, amikor Ön következik.</p>${toWait()}`; screen = "done"; }
      catch { msg = `<h1>Most nem sikerült</h1><p class="lead">Kérjük, próbálja újra, vagy szóljon az orvosnak.</p>`; screen = "done"; }
      busy = false; return draw();
    }
    if (ar) {
      const p = Store.patients.find(x => x.id === ar);
      if (!p || p.arrived !== false) return back();
      busy = true;
      try { await Store.act({ type: "arrive", id: ar }); msg = `<h1>Köszönjük, megérkezését rögzítettük.</h1><p class="lead">Az Ön időpontja:</p><div class="num">${esc(p.time || "")}</div><p class="lead" style="max-width:40ch">Amikor ez az időpont megjelenik a kijelzőn, fáradjon a rendelőbe.</p>${toWait()}`; screen = "done"; }
      catch { msg = `<h1>Most nem sikerült</h1><p class="lead">Kérjük, próbálja újra, vagy szóljon az orvosnak.</p>`; screen = "done"; }
      busy = false; return draw();
    }
    screen = go; draw();
  };
  draw();
  on(() => { if (screen === "appt" && !busy) draw(); }, route);
  cleanup.push(() => { clearTimeout(timer); app.onclick = null; });
}

/* ---------- útválasztás ---------- */
function route() {
  cleanup.forEach(f => { try { f(); } catch {} }); cleanup = [];
  const h = location.hash.replace("#", "");
  if (h === "kilepes") { history.replaceState(null, "", location.pathname); return Store.logout(); }
  if (Store.mode === "login") return viewLogin();
  if (Store.mode === "setup") return viewSetup();
  if (Store.mode === "nodb") return viewNoDb();
  if (Store.mode === "connecting") { app.innerHTML = `<div class="wrap"><p class="muted">Kapcsolódás…</p></div>`; return; }
  if (h === "kijelzo") return viewDisplay();
  if (h === "bejelentkezes") return viewKiosk();
  if (h === "recepcio") return viewReception();
  if (h === "beallitasok") return viewSettings();
  if (h === "orvos" || h.startsWith("orvos-")) return viewDoctor(+h.split("-")[1] || 0);
  viewHome();
}
let routeFn = null;
app.innerHTML = `<div class="wrap"><p class="muted">Kapcsolódás…</p></div>`;
addEventListener("hashchange", route);
Store.init().then(() => route());
})();
</script>

</body></html>
