<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Betegbehívó</title>
<script src="/qrcode.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: egy oldal, négy nézet (#kijelzo, #orvos-N, #recepcio, #beallitasok). Nyugodt mélykék + zsálya. */
:root{
  --bg:#f6f8f7; --surface:#ffffff; --line:#e2e8e5; --fg:#16252e; --muted:#5d6f78;
  --ink:#1c3a4b; --sage:#5f8a76; --sage-soft:#e6efea; --warn:#b5762a; --warn-soft:#f7eddf;
  --danger:#a8463d; --danger-soft:#f6e4e2;
  --display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#16222a; --line:#24343e; --fg:#e7eef0; --muted:#93a5ad;
  --ink:#9fc3d6; --sage:#86b39e; --sage-soft:#1d3029; --warn:#d9a35f; --warn-soft:#33281b;
  --danger:#e08a80; --danger-soft:#3a2321; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#16222a; --line:#24343e; --fg:#e7eef0; --muted:#93a5ad;
  --ink:#9fc3d6; --sage:#86b39e; --sage-soft:#1d3029; --warn:#d9a35f; --warn-soft:#33281b;
  --danger:#e08a80; --danger-soft:#3a2321; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:40px;width:auto;max-width:160px;object-fit:contain}
.mark{width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand-name{font-family:var(--display);font-weight:700;font-size:18px}
.brand-sub{color:var(--muted);font-size:13px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{color:var(--fg);background:var(--surface)}
.nav a.on{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--line);transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sage{background:var(--sage);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.grid{display:grid;gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.waiting{background:var(--sage-soft);color:var(--sage)}
.pill.called{background:var(--ink);color:var(--bg)}
.pill.done{background:var(--line);color:var(--muted)}
.pill.missed{background:var(--warn-soft);color:var(--warn)}
.code{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--fg);font-size:14px;margin-bottom:20px}
.banner b{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Kezdőlap */
.hero-h{font-size:clamp(28px,4vw,40px);font-weight:800;margin:6px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px}
.tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--sage);transform:translateY(-2px)}
.tile h3{font-size:20px}
.tile .ico{width:44px;height:44px;border-radius:12px;background:var(--sage-soft);display:grid;place-items:center;color:var(--sage)}
.tile .ico svg{width:22px;height:22px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.links a{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.steps{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.steps p{margin:6px 0 0;color:var(--muted);font-size:14px}

/* Orvosi felület */
.doc-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.doc-layout{grid-template-columns:1fr}}
.now{display:flex;flex-direction:column;gap:18px;padding:28px}
.now .code{font-size:clamp(64px,12vw,112px);line-height:1;color:var(--ink)}
.now .empty{font-family:var(--display);font-size:22px;color:var(--muted);padding:26px 0}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.actions .btn{padding:18px 12px;font-size:16px}
@media (max-width:480px){.actions{grid-template-columns:1fr 1fr}.actions .btn:first-child{grid-column:1/-1}}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .code{font-size:20px}
.row .meta{min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta b{color:var(--fg);font-weight:600}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.room-pick{display:flex;gap:8px;flex-wrap:wrap}
.room-pick a{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit;text-decoration:none;font-weight:600}
.room-pick a.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* Recepció */
.rec-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:820px){.rec-layout{grid-template-columns:1fr}}
.qr-card{display:flex;gap:16px;align-items:center}
@media (min-width:821px){.rec-layout>section:first-child{grid-column:1;grid-row:1}.qr-card{grid-column:1;grid-row:2}.rec-list{grid-column:2;grid-row:1/span 2}}
.qr-card .qr{background:#fff;padding:8px;border-radius:10px;flex:none}
.qr-card .qr svg{display:block;width:140px;height:140px}
.links-a{font-weight:600;color:var(--ink);font-size:14px}
.pill.qr{background:var(--sage-soft);color:var(--sage)}
.ticket{margin-top:18px;border-radius:var(--r);background:var(--sage-soft);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ticket .code{font-size:54px;line-height:1;color:var(--ink)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}

/* Beállítások */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.room-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:480px){.room-edit{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.check input{margin-top:4px;accent-color:var(--sage);width:18px;height:18px}
.logo-prev{height:64px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;padding:8px;color:var(--muted);font-size:13px}
.logo-prev img{max-height:48px;max-width:100%}

/* ===== Váró-kijelző (TV): saját, mindig sötét megjelenés ===== */
.tv{--tv-bg:#0e2230;--tv-bg2:#123041;--tv-fg:#f3f7f5;--tv-muted:#94aeb9;--tv-sage:#8fc2a8;--tv-line:rgba(255,255,255,.09);
  position:fixed;inset:0;background:radial-gradient(1200px 700px at 15% 0%,#17405a 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#16392f 0%,transparent 60%),var(--tv-bg);
  color:var(--tv-fg);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;font-family:var(--body);color-scheme:dark;
  padding:calc(env(safe-area-inset-top,0px) + 2.2vw) max(2.6vw,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 1.6vw) max(2.6vw,env(safe-area-inset-left,0px))}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.tv-brand{display:flex;align-items:center;gap:1.2vw;min-width:0}
.tv-brand img{height:4.2vw;min-height:36px;max-width:22vw;object-fit:contain}
.tv-brand .mark{width:4.2vw;height:4.2vw;min-width:36px;min-height:36px;border-radius:1vw;background:rgba(255,255,255,.08)}
.tv-brand .n{font-family:var(--display);font-weight:700;font-size:clamp(18px,2vw,40px)}
.tv-clock{text-align:right}
.tv-clock .t{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.2vw,64px);font-variant-numeric:tabular-nums;line-height:1}
.tv-clock .d{color:var(--tv-muted);font-size:clamp(12px,1.2vw,24px);margin-top:.3vw}
.tv-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:2.4vw;padding:2.4vw 0;min-height:0}
@media (max-aspect-ratio:1/1){.tv-main{grid-template-columns:1fr;grid-template-rows:1.5fr 1fr}}
.tv-call{position:relative;border-radius:2vw;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--tv-line);
  display:flex;flex-direction:column;justify-content:center;padding:3vw 4vw;overflow:hidden;min-height:0}
.tv-label{font-size:clamp(13px,1.4vw,28px);letter-spacing:.14em;text-transform:uppercase;color:var(--tv-sage);font-weight:600}
.tv-code{font-family:var(--display);font-weight:800;font-size:clamp(80px,15vw,320px);line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:1vw 0 1.2vw}
.tv-initials{font-family:var(--display);font-size:clamp(18px,2.2vw,44px);color:var(--tv-muted);font-weight:600;margin-top:-.4vw;margin-bottom:1.2vw}
.tv-room{display:flex;align-items:center;gap:1.2vw;font-size:clamp(20px,3vw,60px);font-family:var(--display);font-weight:700}
.tv-room .arrow{width:clamp(26px,3.2vw,64px);height:clamp(26px,3.2vw,64px);border-radius:50%;background:var(--tv-sage);color:#0e2230;display:grid;place-items:center;flex:none}
.tv-room .arrow svg{width:55%;height:55%}
.tv-room small{display:block;font-family:var(--body);font-weight:500;font-size:.45em;color:var(--tv-muted);margin-top:.2vw}
.tv-idle h2{font-size:clamp(32px,4.4vw,88px);font-weight:700;line-height:1.05;margin:1vw 0}
.tv-idle p{font-size:clamp(15px,1.6vw,32px);color:var(--tv-muted);max-width:30ch;margin:0}
.tv-call.flash{animation:flash 1.1s ease 3}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(143,194,168,0)}40%{box-shadow:0 0 0 .6vw rgba(143,194,168,.55);background-color:rgba(143,194,168,.12)}}
.tv-call .enter{animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(2vw)}to{opacity:1;transform:none}}
.tv-side{display:flex;flex-direction:column;gap:1.4vw;min-height:0}
.tv-side h3{font-size:clamp(13px,1.3vw,26px);letter-spacing:.12em;text-transform:uppercase;color:var(--tv-muted);font-weight:600;font-family:var(--body)}
.tv-hist{display:flex;flex-direction:column;gap:.8vw;overflow:hidden}
.tv-hist .it{display:flex;justify-content:space-between;align-items:center;gap:1vw;padding:1.1vw 1.6vw;border-radius:1.2vw;background:rgba(255,255,255,.05);border:1px solid var(--tv-line)}
.tv-hist .c{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.8vw,56px);font-variant-numeric:tabular-nums}
.tv-hist .r{color:var(--tv-muted);font-size:clamp(13px,1.5vw,30px);text-align:right}
.tv-hist .none{color:var(--tv-muted);font-size:clamp(13px,1.4vw,28px)}
.tv-qr{margin-top:auto;display:flex;gap:1.4vw;align-items:center;padding:1.2vw;border-radius:1.2vw;background:rgba(255,255,255,.05);border:1px solid var(--tv-line)}
.tv-qr .qr{background:#fff;padding:.6vw;border-radius:.8vw;flex:none;width:calc(9vw + 1.2vw);min-width:96px}
.tv-qr .qr svg{width:100%;height:auto;display:block}
.tv-qr b{display:block;font-family:var(--display);font-size:clamp(14px,1.5vw,30px)}
.tv-qr span{color:var(--tv-muted);font-size:clamp(11px,1.05vw,21px);line-height:1.35}
.tv-hist{flex:0 1 auto}
.tv-foot{display:flex;justify-content:space-between;align-items:center;gap:2vw;border-top:1px solid var(--tv-line);padding-top:1.4vw;color:var(--tv-muted);font-size:clamp(12px,1.3vw,26px)}
.tv-foot .wait b{color:var(--tv-fg);font-family:var(--display);font-size:1.3em}
.tv-tip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .6s}
.tv-start{position:fixed;inset:0;z-index:20;background:rgba(8,20,28,.82);backdrop-filter:blur(6px);display:grid;place-items:center;text-align:center;color:#f3f7f5;padding:24px}
.tv-start h2{font-size:clamp(24px,3vw,44px);margin-bottom:10px}
.tv-start p{color:#94aeb9;max-width:46ch;margin:0 auto 22px}
.tv-start .btn{background:#8fc2a8;color:#0e2230;font-size:18px;padding:16px 28px}
.tv-exit{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));opacity:0;transition:opacity .3s;z-index:5;font-size:12px;color:#94aeb9;text-decoration:none;background:rgba(255,255,255,.06);padding:6px 10px;border-radius:8px}
.tv:hover .tv-exit,.tv-exit:focus{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
"use strict";
/* ---------- segédek ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(3, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const hhmm = t => t ? new Date(t).toLocaleTimeString("hu-HU", {hour:"2-digit", minute:"2-digit"}) : "";
const uid = () => Math.random().toString(36).slice(2, 10);
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const ICON = {
  cross:'<svg viewBox="0 0 24 24" fill="none"><path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z" fill="#fff"/></svg>',
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3v6a5 5 0 0 0 10 0V3"/><path d="M11 14v2a4 4 0 0 0 8 0v-2"/><circle cx="19" cy="12" r="2"/></svg>',
  desk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16v4H4z"/><path d="M6 11v8M18 11v8M9 7V4h6v3"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'
};

const DEFAULT_SETTINGS = {
  clinicName: "Magánrendelő",
  prefix: "A",
  rooms: [{id:1, name:"1-es rendelő", doctor:""}, {id:2, name:"2-es rendelő", doctor:""}],
  showInitials: true,
  speech: true,
  gong: true,
  showQr: true,
  logo: ""
};

/* ---------- adattár: a saját szerver API-ja ---------- */
const Store = (() => {
  let pin = lsGet("bh-pin", ""), state = null, mode = "connecting", timer = null, interval = 4000, skew = 0, lastS = "";
  const subs = { patients: new Set(), settings: new Set() };
  const emitP = () => [...subs.patients].forEach(f => subs.patients.has(f) && f(state.patients));
  const emitS = () => [...subs.settings].forEach(f => subs.settings.has(f) && f(state.settings));
  async function api(path, opts = {}) {
    const r = await fetch(path, Object.assign({}, opts, { headers: { "Content-Type": "application/json", "x-pin": pin } }));
    if (r.status === 401) { const j = await r.json().catch(() => ({})); const was = mode; mode = j.error === "setup" ? "setup" : "login"; if (was !== mode) route(); throw new Error("pin"); }
    if (r.status === 503) { const was = mode; mode = "nodb"; if (was !== "nodb") route(); throw new Error("nodb"); }
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }
  function apply(st) {
    const first = !state; skew = st.now - Date.now(); state = st;
    const k = JSON.stringify(st.settings);
    if (first || k !== lastS) { lastS = k; emitS(); }
    emitP();
  }
  async function poll() {
    clearTimeout(timer);
    try { const st = await api("/api/state"); const was = mode; mode = "shared"; apply(st); if (was !== "shared") route(); }
    catch (e) { if (mode === "login" || mode === "nodb" || mode === "setup") return; }
    timer = setTimeout(poll, document.hidden ? 15000 : interval);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && mode === "shared") poll(); });
  async function act(a) { const j = await api("/api/action", { method: "POST", body: JSON.stringify(a) }); apply(j.state); return j.result; }
  return {
    init: async () => { await poll(); },
    login: async p => { pin = p; lsSet("bh-pin", p); mode = "connecting"; await poll(); return mode === "shared"; },
    logout: () => { pin = ""; lsSet("bh-pin", ""); mode = "login"; clearTimeout(timer); route(); },
    setInterval: ms => { interval = ms; },
    act, now: () => Date.now() + skew,

/* ---------- hang: gong + magyar bemondás ---------- */
const Sound = (() => {
  let ctx = null;
  const unlock = () => { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {} };
  function tone(freq, start, dur, vol) {
    [1, 2.01, 3.02].forEach((h, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq * h;
      const v = vol * [1, .28, .1][i];
      g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(v, start + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g).connect(ctx.destination); o.start(start); o.stop(start + dur + .05);
    });
  }
  function gong() { if (!ctx) return; const t = ctx.currentTime + .05; tone(659.25, t, 1.8, .35); tone(523.25, t + .55, 2.4, .32); }
  function say(text) {
    try {
      const ss = window.speechSynthesis; if (!ss) return;
      const u = new SpeechSynthesisUtterance(text); u.lang = "hu-HU"; u.rate = .92;
      const v = ss.getVoices().find(v => /^hu/i.test(v.lang)); if (v) u.voice = v;
      ss.cancel(); ss.speak(u);
    } catch {}
  }
  return { unlock, gong, say, get ready() { return !!ctx && ctx.state === "running"; } };
})();
function spoken(p) {
  const name = roomName(p.calledRoom);
  const code = p.code.replace("-", " ").replace(/\b0+(\d)/, "$1");
  const where = /rendelő$/i.test(name) ? "a " + name + "be" : name;
  return `${code}. Kérjük, fáradjon ${where}.`;
}

  let wake = null;

  if (go) go.onclick = async () => {
    Sound.unlock(); $("#tvStart").remove();
    try { await document.documentElement.requestFullscreen?.(); } catch {}

  };
  cleanup.push(() => { try { wake && wake.release(); } catch {} document.documentElement.style.background = ""; if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); });

  const tick = () => {
    const d = new Date();

  cleanup.push(() => { clearInterval(ti); clearInterval(tt); });

  const seen = new Map(); let primed = false, lastShownKey = "";
  function brand() {
    const s = S();
    $("#tvBrand").innerHTML = (s.logo ? `<img src="${esc(s.logo)}" alt="">` : `<div class="mark">${ICON.cross}</div>`) + `<div class="n">${esc(s.clinicName)}</div>`;
  }
  function render(list, announce) {
    const s = S();
    const called = list.filter(p => p.calledAt && (p.status === "called" || p.status === "done" || p.status === "missed")).sort((a, b) => b.calledAt - a.calledAt);
    const active = list.filter(p => p.status === "called").sort((a, b) => b.calledAt - a.calledAt);

      if (hero) {

    }
  };
  draw(Store.patients);
  const q = () => { drawQr($("#recQr"), 140, "#1c3a4b", "#ffffff"); $("#recQrLink").href = checkinUrl(); };
  q(); on(draw, null); on(q, null);
}

/* Beállítások */
function viewSettings() {
  const s = JSON.parse(JSON.stringify(S()));
  app.innerHTML = shell("beallitasok", "Beállítások", `
    <div class="set-grid">
      <section class="card grid">
        <h2 style="font-size:20px">Arculat</h2>
        <div class="field"><label for="cn">A rendelő neve</label><input type="text" id="cn" value="${esc(s.clinicName)}"></div>
        <div class="field"><label for="lg">Logó (PNG, JPG vagy SVG)</label><div class="logo-prev" id="lp"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="file" id="lg" accept="image/*" style="font-size:13px;max-width:100%"><button class="btn small ghost" type="button" id="lgx">Logó eltávolítása</button></div></div>
        <div class="field"><label for="px">Sorszám előtag</label><input type="text" id="px" maxlength="2" value="${esc(s.prefix)}" style="max-width:120px"></div>
      </section>
      <section class="card grid">
        <h2 style="font-size:20px">Rendelők</h2>
        <div id="rl" class="grid" style="gap:10px"></div>
        <button class="btn ghost" type="button" id="radd">+ Rendelő hozzáadása</button>
      </section>
      <section class="card">
        <h2 style="font-size:20px;margin-bottom:8px">Kijelző és hang</h2>
        <label class="check"><input type="checkbox" id="si" ${s.showInitials ? "checked" : ""}><span><b>Monogram a kijelzőn</b><br><span class="muted" style="font-size:13px">Kikapcsolva csak a sorszám látszik.</span></span></label>
        <label class="check"><input type="checkbox" id="sq" ${s.showQr ? "checked" : ""}><span><b>QR-kód a kijelzőn</b><br><span class="muted" style="font-size:13px">A betegek mobilról kérhetnek sorszámot.</span></span></label>
        <label class="check"><input type="checkbox" id="gg" ${s.gong ? "checked" : ""}><span><b>Gong hívásnál</b></span></label>
        <label class="check"><input type="checkbox" id="sp" ${s.speech ? "checked" : ""}><span><b>Magyar hangos bemondás</b><br><span class="muted" style="font-size:13px">A TV böngészőjének magyar hangját használja, ha van.</span></span></label>
        <button class="btn ghost small" type="button" id="test" style="margin-top:8px">Hang kipróbálása</button>
      </section>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn primary" id="save">Mentés</button></div>`);
  const lp = () => { $("#lp").innerHTML = s.logo ? `<img src="${esc(s.logo)}" alt="Logó">` : "Még nincs logó feltöltve"; };
  const rl = () => {
    $("#rl").innerHTML = s.rooms.map((r, i) => `<div class="room-edit"><div class="field"><label for="rn${i}">Név</label><input type="text" id="rn${i}" data-i="${i}" data-k="name" value="${esc(r.name)}"></div><div class="field"><label for="rd${i}">Orvos (nem kötelező)</label><input type="text" id="rd${i}" data-i="${i}" data-k="doctor" value="${esc(r.doctor)}" placeholder="pl. Dr. Szabó Éva"></div><button class="btn small ghost" type="button" data-rm="${i}" ${s.rooms.length < 2 ? "disabled" : ""}>Törlés</button></div>`).join("");
  };
  lp(); rl();
  $("#rl").oninput = e => { const i = e.target.dataset.i; if (i != null) s.rooms[i][e.target.dataset.k] = e.target.value; };
  $("#rl").onclick = e => { const i = e.target.dataset.rm; if (i != null && s.rooms.length > 1) { s.rooms.splice(+i, 1); rl(); } };
  $("#radd").onclick = () => { const id = Math.max(0, ...s.rooms.map(r => r.id)) + 1; s.rooms.push({id, name: id + "-es rendelő", doctor: ""}); rl(); };
  $("#lgx").onclick = () => { s.logo = ""; lp(); };
  $("#lg").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, 480 / img.width, 160 / img.height);
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      s.logo = c.toDataURL("image/png"); URL.revokeObjectURL(url); lp();
    };
    img.onerror = () => toast("Ezt a képet nem sikerült beolvasni.");
    img.src = url;
  };
  $("#test").onclick = () => { Sound.unlock(); if ($("#gg").checked) Sound.gong(); setTimeout(() => { if ($("#sp").checked) Sound.say(spoken({code: (s.prefix || "A") + "-012", calledRoom: s.rooms[0].id})); }, 1500); };
  $("#save").onclick = async () => {
    s.clinicName = $("#cn").value.trim() || "Magánrendelő";
    s.prefix = ($("#px").value.trim() || "A").toUpperCase();
    s.showInitials = $("#si").checked; s.showQr = $("#sq").checked; s.gong = $("#gg").checked; s.speech = $("#sp").checked;
    s.rooms = s.rooms.map(r => ({id: r.id, name: r.name.trim() || r.id + "-es rendelő", doctor: (r.doctor || "").trim()}));
    try { await Store.saveSettings(s); toast("Beállítások mentve"); } catch (e) { console.warn(e); toast("Mentés nem sikerült."); }
  };
}

/* Belépés */
function viewLogin() {
  app.innerHTML = `<div class="wrap" style="max-width:420px;padding-top:12vh"><div class="card grid">
    <div class="mark">${ICON.cross}</div>
    <h1 style="font-size:24px">Betegbehívó</h1>
    <p class="muted" style="margin:0">Add meg a rendelő PIN-kódját. Ezen a gépen megjegyezzük, nem kell minden nap beírni.</p>
    <form id="lf" class="grid"><div class="field"><label for="pin">PIN-kód</label><input type="text" id="pin" inputmode="numeric" autocomplete="off" style="font-size:22px;letter-spacing:.3em"></div>
    <button class="btn primary" type="submit">Belépés</button><div class="muted" id="lerr" style="font-size:13px;color:var(--danger)"></div></form></div></div>`;
  $("#pin").focus();
  $("#lf").onsubmit = async e => { e.preventDefault(); const ok = await Store.login($("#pin").value.trim()); if (!ok && Store.mode === "login") { route(); $("#lerr").textContent = "Hibás PIN-kód."; } };
}
function viewSetup() {
  app.innerHTML = `<div class="wrap" style="max-width:460px;padding-top:10vh"><div class="card grid">
    <div class="mark">${ICON.cross}</div>
    <h1 style="font-size:24px">Üdvözlünk! Állíts be egy PIN-kódot</h1>
    <p class="muted" style="margin:0">Ezzel léptek be a váró-kijelzőn, az orvosi gépen és a recepción. A betegeknek nem kell, ők a QR-kódot használják. 4–8 számjegy legyen.</p>
    <form id="sf" class="grid"><div class="field"><label for="np">Új PIN-kód</label><input type="text" id="np" inputmode="numeric" autocomplete="off" maxlength="8" style="font-size:22px;letter-spacing:.3em"></div>
    <div class="field"><label for="np2">PIN-kód még egyszer</label><input type="text" id="np2" inputmode="numeric" autocomplete="off" maxlength="8" style="font-size:22px;letter-spacing:.3em"></div>
    <button class="btn primary" type="submit">PIN-kód mentése</button><div class="muted" id="serr" style="font-size:13px;color:var(--danger)"></div></form></div></div>`;
  $("#np").focus();
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const a = $("#np").value.trim(), b = $("#np2").value.trim();
    if (!/^\d{4,8}$/.test(a)) return $("#serr").textContent = "4–8 számjegyet adj meg.";
    if (a !== b) return $("#serr").textContent = "A két PIN-kód nem egyezik.";
    const r = await fetch("/api/setup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: a }) });
    if (!r.ok && r.status !== 409) return $("#serr").textContent = "Nem sikerült menteni, próbáld újra.";
    const ok = await Store.login(a); if (!ok) route();
  };
}
function viewNoDb() {
  app.innerHTML = `<div class="wrap" style="max-width:560px;padding-top:12vh"><div class="card grid"><h1 style="font-size:22px">Az adatbázis még nincs bekötve</h1><p class="muted" style="margin:0">Az alkalmazás fut, de még nincs hova mentenie a sort. Ha a tárhelyen bekötötted az adatbázist, frissítsd az oldalt.</p><button class="btn primary" onclick="location.reload()">Újrapróbálás</button></div></div>`;
}

/* ---------- útválasztás ---------- */
function route() {
  cleanup.forEach(f => { try { f(); } catch {} }); cleanup = [];
  const h = location.hash.replace("#", "");
  if (h === "kilepes") { history.replaceState(null, "", location.pathname); return Store.logout(); }
  if (Store.mode === "login") return viewLogin();
  if (Store.mode === "setup") return viewSetup();
  if (Store.mode === "nodb") return viewNoDb();
  if (Store.mode === "connecting") { app.innerHTML = `<div class="wrap"><p class="muted">Kapcsolódás…</p></div>`; return; }
  if (h === "kijelzo") return viewDisplay();
  if (h === "recepcio") return viewReception();
  if (h === "beallitasok") return viewSettings();
  if (h === "orvos" || h.startsWith("orvos-")) return viewDoctor(+h.split("-")[1] || 0);
  viewHome();
}
let routeFn = null;
app.innerHTML = `<div class="wrap"><p class="muted">Kapcsolódás…</p></div>`;
addEventListener("hashchange", route);
Store.init().then(() => route());
})();
</script>

</body></html>
