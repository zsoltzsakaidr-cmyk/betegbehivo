<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Sorszám</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f8f7;--surface:#fff;--line:#e2e8e5;--fg:#16252e;--muted:#5d6f78;--ink:#1c3a4b;--sage:#5f8a76;--sage-soft:#e6efea;--warn:#b5762a;--warn-soft:#f7eddf;
  --display:"Manrope",ui-sans-serif,system-ui,sans-serif;--body:"Inter",ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--surface:#16222a;--line:#24343e;--fg:#e7eef0;--muted:#93a5ad;--ink:#9fc3d6;--sage:#86b39e;--sage-soft:#1d3029;--warn:#d9a35f;--warn-soft:#33281b;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;min-height:100vh}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:38px;max-width:160px;object-fit:contain}
.mark{width:38px;height:38px;border-radius:11px;background:#1c3a4b;display:grid;place-items:center}.mark svg{width:21px;height:21px}
.bs{font-size:13px;color:var(--muted)}
.bn{font-family:var(--display);font-weight:700;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}.small{font-size:13px}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
input,select{font:inherit;color:inherit;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px;background:var(--ink);color:var(--bg);cursor:pointer;font-size:17px}
.btn:disabled{opacity:.5}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage)}
.code{font-family:var(--display);font-weight:800;font-size:76px;line-height:1;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ahead{display:flex;align-items:baseline;gap:10px}.ahead b{font-family:var(--display);font-size:44px;line-height:1}
.called{background:var(--sage);color:#fff;border-color:var(--sage);animation:pulse 1.4s ease 4}
.called .code,.called .eyebrow,.called .muted{color:#fff}
.room{font-family:var(--display);font-size:28px;font-weight:800}
@keyframes pulse{50%{transform:scale(1.02)}}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.slot{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.slot b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}.slot span{color:var(--muted);font-size:14px}
.slot:active{transform:scale(.98)}.slot:disabled{opacity:.5}
.link{font:inherit;background:none;border:0;color:var(--ink);text-decoration:underline;padding:4px 0;cursor:pointer;text-align:left}
.note{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="wrap" id="app"><p class="muted">Betöltés…</p></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const CROSS = '<svg viewBox="0 0 24 24"><path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z" fill="#fff"/></svg>';
const t = new URLSearchParams(location.search).get("t") || "";
const app = $("#app");
let info = null;
const brand = () => `<div class="brand">${info && info.logo ? `<img src="${esc(info.logo)}" alt="">` : `<div class="mark">${CROSS}</div>`}<div><div class="bn">${esc(info ? info.clinicName : "")}</div>${info && info.clinicSub ? `<div class="bs">${esc(info.clinicSub)}</div>` : ""}</div></div>`;

async function start() {
  try { info = await (await fetch("/api/checkin?t=" + encodeURIComponent(t))).json(); } catch { info = null; }
  const saved = get("bh-ticket");
  const todayStr = new Intl.DateTimeFormat("en-CA", {timeZone: "Europe/Budapest"}).format(new Date());
  if (saved && saved.day === todayStr) return status(saved);
  if (!info || info.error) return app.innerHTML = `<div class="card"><h1>A szolgáltatás most nem érhető el</h1><p class="muted">Kérjük, jelentkezzen a recepción.</p></div>`;
  if (!info.valid) return app.innerHTML = brand() + `<div class="card"><h1>Ez a QR-kód lejárt</h1><p class="muted">A kód minden nap megújul. Kérjük, olvassa be a váróterem kijelzőjén látható friss kódot, vagy jelentkezzen a recepción.</p></div>`;
  if (info.appointments && info.appointments.length) return pick(); else form();
}
function pick() {
  app.innerHTML = brand() + `<div class="card"><div class="eyebrow">Megérkezett?</div><h1>Válassza ki az időpontját</h1>
    <p class="muted" style="margin:0">A nevek helyett csak az időpont és a monogram látszik.</p>
    <div class="slots">${info.appointments.map(a => `<button class="slot" data-id="${esc(a.id)}"><b>${esc(a.time)}</b><span>${esc(a.initials || "–")}</span></button>`).join("")}</div>
    <div id="err" class="note" hidden></div>
    <button class="link" id="noappt">Nincs előre egyeztetett időpontom</button></div>`;
  $("#noappt").onclick = form;
  app.querySelector(".slots").onclick = async e => {
    const btn = e.target.closest(".slot"); if (!btn) return;
    app.querySelectorAll(".slot").forEach(x => x.disabled = true);
    try {
      const r = await fetch("/api/checkin", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({t, claim: btn.dataset.id})});
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      put("bh-ticket", j); status(j);
    } catch (err) {
      const m = {taken: "Ezt az időpontot már valaki kiválasztotta. Ha az Öné, kérjük, szóljon az orvosnak.", gone: "Ez az időpont már nem érhető el.", rate: "Túl sok próbálkozás erről a telefonról."}[err.message] || "Nem sikerült, kérjük, próbálja újra.";
      $("#err").hidden = false; $("#err").textContent = m; app.querySelectorAll(".slot").forEach(x => x.disabled = false);
    }
  };
}
function form() {
  const rooms = info.rooms || [];
  app.innerHTML = brand() + `<div class="card"><div class="eyebrow">Bejelentkezés</div><h1>Sorszám kérése</h1>
    <p class="muted" style="margin:0">Néhány másodperc, és itt követheti, mikor kerül sorra. A váróterem kijelzője is mutatja a hívást.</p>
    <form id="f" style="display:flex;flex-direction:column;gap:14px">
      <div><label for="ini">Monogram (nem kötelező)</label><input id="ini" maxlength="6" placeholder="pl. K. A." autocomplete="off"></div>
      ${rooms.length > 1 ? `<div><label for="rm">Kihez érkezett?</label><select id="rm"><option value="0">Nem tudom / bármelyik</option>${rooms.map(r => `<option value="${r.id}">${esc(r.doctor ? r.doctor + " (" + r.name + ")" : r.name)}</option>`).join("")}</select></div>` : ""}
      <button class="btn" type="submit">Sorszámot kérek</button>
      <p class="muted small" style="margin:0">Nevet nem kérünk. Csak a sorszámot és a megadott monogramot tároljuk, ezek a nap végén törlődnek.</p>
      <div id="err" class="note" hidden></div>
    </form></div>`;
  $("#f").onsubmit = async e => {
    e.preventDefault(); const b = $("#f .btn"); b.disabled = true;
    try {
      const r = await fetch("/api/checkin", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({t, initials: $("#ini").value, room: $("#rm") ? +$("#rm").value : 0})});
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      put("bh-ticket", j); status(j);
    } catch (err) {
      const m = {rate: "Erről a telefonról már több sorszámot kértek. Kérjük, jelentkezzen a recepción.", token: "A QR-kód lejárt, kérjük, olvassa be újra a kijelzőről."}[err.message] || "Nem sikerült a sorszámot kiadni. Kérjük, próbálja újra, vagy jelentkezzen a recepción.";
      $("#err").hidden = false; $("#err").textContent = m; b.disabled = false;
    }
  };
}
let timer = null, lastCall = 0;
async function status(tk) {
  clearTimeout(timer);
  let s;
  try { const r = await fetch(`/api/ticket?id=${encodeURIComponent(tk.id)}&k=${encodeURIComponent(tk.k)}`); if (r.status === 404) { put("bh-ticket", null); return start(); } s = await r.json(); } catch { s = null; }
  if (s) {
    if (!info) info = {clinicName: s.clinicName, clinicSub: s.clinicSub};
    let body;
    if (s.status === "waiting") body = `<div class="card"><div class="eyebrow">Az Ön sorszáma</div><div class="code">${esc(s.code)}</div>
      ${s.time ? `<div class="muted">Időpont: <b style="color:var(--fg)">${esc(s.time)}</b></div>` : ""}<div class="ahead"><b>${s.ahead}</b><span class="muted">${s.ahead ? "beteg vár Ön előtt" : "Ön következik"}</span></div>
      <p class="muted small" style="margin:0">Tartsa nyitva ezt az oldalt. Amikor behívják, itt és a váróterem kijelzőjén is megjelenik.</p></div>`;
    else if (s.status === "called") body = `<div class="card called" role="alert"><div class="eyebrow">Önt hívják</div><div class="code">${esc(s.code)}</div>
      <div class="room">${esc(s.roomName || "Kérjük, fáradjon be")}</div>${s.doctor ? `<div class="muted">${esc(s.doctor)}</div>` : ""}</div>`;
    else if (s.status === "missed") body = `<div class="card"><div class="eyebrow">${esc(s.code)}</div><h1>Lekéste a hívást</h1><p class="muted" style="margin:0">Kérjük, jelentkezzen a recepción, és visszatesszük a sorba.</p></div>`;
    else body = `<div class="card"><div class="eyebrow">${esc(s.code)}</div><h1>Köszönjük a látogatást!</h1><p class="muted" style="margin:0">Jó egészséget kívánunk.</p></div>`;
    app.innerHTML = brand() + body;
    if (s.status === "called" && s.calledAt !== lastCall) { lastCall = s.calledAt; try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch {} }
    if (s.status === "done") return;
  }
  timer = setTimeout(() => status(tk), document.hidden ? 15000 : 5000);
}
document.addEventListener("visibilitychange", () => { const tk = get("bh-ticket"); if (!document.hidden && tk) status(tk); });
start();
})();
</script>
</body></html>
